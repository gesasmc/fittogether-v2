name: Build FitTogether icon assets

on:
  push:
    paths:
      - 'public/fittogether-icon-180-base64.txt'
      - '.github/workflows/build-icon.yml'

permissions:
  contents: write

jobs:
  build-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode approved icon
        run: |
          base64 -d public/fittogether-icon-180-base64.txt > public/fittogether-icon-180.png
          cp public/fittogether-icon-180.png public/apple-touch-icon.png
      - name: Commit repaired icon assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/fittogether-icon-180.png public/apple-touch-icon.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build approved FitTogether icon assets'
          git push
