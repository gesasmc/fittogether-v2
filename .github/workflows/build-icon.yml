name: Build Zink approved icon
on:
  push:
    paths:
      - 'public/zink-zuschnittplaner/icon-v210-part*.txt'
      - '.github/workflows/build-icon.yml'
permissions:
  contents: write
jobs:
  build-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode approved Zink icon
        run: |
          cat public/zink-zuschnittplaner/icon-v210-part*.txt | base64 -d > public/zink-zuschnittplaner/apple-touch-icon-v210.png
      - name: Commit approved Zink icon
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/zink-zuschnittplaner/apple-touch-icon-v210.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build approved Zink icon V2.10'
          git push
