name: Apply V2.0.88 resume wiring

on:
  push:
    paths:
      - '.github/workflows/apply-v288.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch V2.0.88 wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('vite.config.js')
          s=p.read_text()
          if "import trainingResume288 from './vite288.js'" not in s:
              s=s.replace("import trainingMemory277 from './vite277.js'", "import trainingMemory277 from './vite277.js'\nimport trainingResume288 from './vite288.js'")
          s=s.replace("plugins: [appBridge286(),stableRestTimer(),workoutExperience271(),trainingMemory277(),react()]", "plugins: [appBridge286(),stableRestTimer(),workoutExperience271(),trainingMemory277(),trainingResume288(),react()]")
          p.write_text(s)

          p=Path('src/main.jsx')
          s=p.read_text()
          if "import './v288.css'" not in s:
              s=s.replace("import './v285.css'", "import './v285.css'\nimport './v288.css'")
          p.write_text(s)

          p=Path('src/versionCheck.js')
          s=p.read_text().replace("const CURRENT_VERSION='V2.0.87'", "const CURRENT_VERSION='V2.0.88'")
          p.write_text(s)

          Path('public/version.json').write_text('{"version":"V2.0.88"}\n')
          PY
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vite.config.js src/main.jsx src/versionCheck.js public/version.json
          git commit -m "Wire V2.0.88 resumable training" || exit 0
          git push
