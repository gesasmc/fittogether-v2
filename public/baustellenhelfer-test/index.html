<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f1113"><title>Baustellenhelfer Test</title><style>
:root{--bg:#0f1113;--card:#191d21;--card2:#111417;--line:#343b42;--text:#f4f5f6;--muted:#9da5ad;--yellow:#f5bd32;--red:#51282d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;padding-bottom:100px}header{position:sticky;top:0;z-index:5;background:rgba(15,17,19,.95);backdrop-filter:blur(12px);padding:calc(18px + env(safe-area-inset-top)) 18px 14px;border-bottom:1px solid var(--line)}h1{font-size:26px;margin:0}h2{margin:0 0 12px;font-size:21px}.sub{color:var(--muted);font-size:14px;line-height:1.4}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}.row{display:flex;gap:10px;align-items:center}.grow{flex:1}input,select{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:13px;font-size:16px}button{border:0;border-radius:12px;padding:12px 14px;background:var(--yellow);color:#111;font-weight:800;font-size:15px}.secondary{background:#2b3137;color:var(--text)}.danger{background:var(--red);color:#ffb4b8}.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}.item.done .txt{text-decoration:line-through;opacity:.45}.check{width:27px;height:27px;border:2px solid #6e7780;border-radius:8px;display:grid;place-items:center;flex:none}.done .check{background:var(--yellow);border-color:var(--yellow);color:#111}.tag{font-size:12px;background:#2b3137;padding:5px 8px;border-radius:999px;color:#cbd1d6}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#101214;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.tabs button{background:#282e34;color:#ddd;padding:10px 4px;font-size:12px}.tabs button.active{background:var(--yellow);color:#111}.page{display:none}.page.active{display:block}.cat{margin-top:14px}.cathead{font-weight:800;padding:8px 0}.empty{color:var(--muted);padding:12px 0}.tool{display:block;text-decoration:none;color:var(--text);padding:16px;background:var(--card2);border:1px solid var(--line);border-radius:14px;margin-top:10px}.tool b{display:block;margin-bottom:4px}
</style></head><body><header><h1>Baustellenhelfer <span style="color:#f5bd32">TEST</span></h1><div class="sub">Material, To-dos und Werkzeuge für die Baustelle</div></header><main class="wrap">
<section id="jobs" class="page active"><div class="card"><h2>Baustellen</h2><div class="row"><input id="jobInput" placeholder="z. B. Müller – Gaube"><button onclick="addJob()">＋</button></div><div id="jobList"></div></div></section>
<section id="material" class="page"><div class="card"><div class="row"><button class="secondary" onclick="show('jobs')">‹ Hauptmenü</button><div class="grow"></div></div><h2 style="margin-top:14px">Materialliste</h2><div class="sub" id="matJob"></div><div class="row" style="margin-top:12px"><input id="matInput" class="grow" placeholder="Material"><input id="matQty" style="width:95px" inputmode="decimal" placeholder="Menge"></div><div class="row" style="margin-top:10px"><select id="matUnit" style="width:130px"><option>Stück</option><option>m</option><option>m²</option><option>lfm</option><option>kg</option><option>Liter</option><option>Packung</option><option>Rolle</option></select><select id="matCat" class="grow"><option>Holz</option><option>Zink / Blech</option><option>Befestigung</option><option>Abdichtung</option><option>Dämmung</option><option>Dachziegel</option><option>Werkzeug</option><option>Sonstiges</option></select><button onclick="addMaterial()">＋</button></div><div id="matList"></div></div></section>
<section id="todos" class="page"><div class="card"><div class="row"><button class="secondary" onclick="show('jobs')">‹ Hauptmenü</button><div class="grow"></div></div><h2 style="margin-top:14px">To-dos</h2><div class="sub" id="todoJob"></div><div class="row" style="margin-top:12px"><input id="todoInput" placeholder="Was muss gemacht werden?"><button onclick="addTodo()">＋</button></div><div id="todoList"></div></div></section>
<section id="tools" class="page"><div class="card"><div class="row"><button class="secondary" onclick="show('jobs')">‹ Hauptmenü</button><div class="grow"></div></div><h2 style="margin-top:14px">Werkzeuge</h2><a class="tool" href="/zink-zuschnittplaner/"><b>✂️ Zink Zuschnittplaner</b><span class="sub">Zuschnitte optimieren und Kantteile zeichnen</span></a><div class="tool"><b>🧮 Baustellen-Rechner</b><span class="sub">Kommt als Nächstes – Maße, Gefälle, Diagonalen und mehr.</span></div></div></section>
</main><nav class="tabs"><button data-p="jobs" class="active">▦<br>Baustellen</button><button data-p="material">☷<br>Material</button><button data-p="todos">✓<br>To-dos</button><button data-p="tools">⌁<br>Werkzeuge</button></nav>
<script>
const K='dachhelfer-test-v01';let data=JSON.parse(localStorage.getItem(K)||'{"jobs":[]}'),active=localStorage.getItem(K+'-active')||'';
function save(){localStorage.setItem(K,JSON.stringify(data));localStorage.setItem(K+'-active',active)}
function job(){return data.jobs.find(x=>x.id===active)}
function addJob(){let n=jobInput.value.trim();if(!n)return;let j={id:String(Date.now()),name:n,material:[],todos:[]};data.jobs.push(j);active=j.id;jobInput.value='';save();render()}
function selectJob(id){active=id;save();render();show('material')}
function delJob(id,e){e.stopPropagation();data.jobs=data.jobs.filter(x=>x.id!==id);if(active===id)active=data.jobs[0]?.id||'';save();render()}
function addMaterial(){let j=job(),n=matInput.value.trim();if(!j||!n)return;j.material.push({id:Date.now(),name:n,qty:matQty.value.trim(),unit:matUnit.value,cat:matCat.value,done:false});matInput.value='';matQty.value='';save();render()}
function addTodo(){let j=job(),n=todoInput.value.trim();if(!j||!n)return;j.todos.push({id:Date.now(),name:n,done:false});todoInput.value='';save();render()}
function toggle(type,id){let j=job(),x=j?.[type].find(x=>x.id===id);if(x)x.done=!x.done;save();render()}
function remove(type,id){let j=job();if(j)j[type]=j[type].filter(x=>x.id!==id);save();render()}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){let j=job();jobList.innerHTML=data.jobs.length?data.jobs.map(x=>'<div class="item" onclick="selectJob(\''+x.id+'\')"><div class="grow"><b>'+esc(x.name)+'</b><div class="sub">'+x.material.filter(m=>!m.done).length+' Material offen · '+x.todos.filter(t=>!t.done).length+' To-dos offen</div></div><button class="danger" onclick="delJob(\''+x.id+'\',event)">×</button></div>').join(''):'<div class="empty">Noch keine Baustelle angelegt.</div>';
 matJob.textContent=todoJob.textContent=j?'Baustelle: '+j.name:'Erst eine Baustelle auswählen.';
 if(!j){matList.innerHTML=todoList.innerHTML='<div class="empty">Keine Baustelle ausgewählt.</div>';return}
 let cats=[...new Set(j.material.map(x=>x.cat))];matList.innerHTML=cats.map(c=>'<div class="cat"><div class="cathead">'+esc(c)+'</div>'+j.material.filter(x=>x.cat===c).map(x=>'<div class="item '+(x.done?'done':'')+'" onclick="toggle(\'material\','+x.id+')"><div class="check">'+(x.done?'✓':'')+'</div><div class="txt grow"><b>'+esc(x.name)+'</b>'+(x.qty?'<div class="sub">'+esc(x.qty)+' '+esc(x.unit||'Stück')+'</div>':'')+'</div><button class="danger" onclick="event.stopPropagation();remove(\'material\','+x.id+')">×</button></div>').join('')+'</div>').join('')||'<div class="empty">Noch kein Material.</div>';
 todoList.innerHTML=j.todos.map(x=>'<div class="item '+(x.done?'done':'')+'" onclick="toggle(\'todos\','+x.id+')"><div class="check">'+(x.done?'✓':'')+'</div><div class="txt grow">'+esc(x.name)+'</div><button class="danger" onclick="event.stopPropagation();remove(\'todos\','+x.id+')">×</button></div>').join('')||'<div class="empty">Noch keine To-dos.</div>'}
function show(p){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===p));document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.p===p))}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.p));render();
</script><footer style="text-align:center;color:#6f7780;font-size:11px">Baustellenhelfer · Test V0.2</footer></body></html>
