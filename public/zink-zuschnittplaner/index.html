<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#111315" />
<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZinkPlan">
<title>Zink Zuschnittplaner</title>
<style>
:root{--bg:#0f1113;--card:#171a1e;--card2:#1e2227;--text:#f2f3f5;--muted:#9fa6ad;--accent:#f4bd31;--danger:#ff6b6b;--line:#30363d;--ok:#67d391}
*{box-sizing:border-box}body{margin:0;padding-bottom:calc(78px + env(safe-area-inset-bottom));background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:5;background:rgba(15,17,19,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:16px max(16px,env(safe-area-inset-left))}.wrap{max-width:1050px;margin:auto;padding:18px}h1{font-size:23px;margin:0}h2{font-size:18px;margin:0 0 12px}.sub{color:var(--muted);font-size:13px;margin-top:3px}.grid{display:grid;gap:14px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.four{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 5px 24px rgba(0,0,0,.18)}label{display:block;color:var(--muted);font-size:12px;margin:0 0 6px}.field input,.field select{width:100%;border:1px solid var(--line);background:var(--card2);color:var(--text);padding:12px;border-radius:11px;font-size:16px;outline:none}.field input:focus{border-color:var(--accent)}button{border:0;border-radius:11px;padding:11px 14px;font-weight:700;background:var(--accent);color:#111;cursor:pointer}.secondary{background:#2b3138;color:var(--text)}.danger{background:#402329;color:#ffb3b3}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}.cuts{display:grid;gap:9px}.cut{display:grid;grid-template-columns:1.5fr .8fr 1fr 1fr 1fr auto;gap:8px;align-items:end;background:var(--card2);padding:10px;border-radius:12px}.cut input,.cut select{width:100%;background:#111417;border:1px solid var(--line);color:var(--text);padding:10px;border-radius:9px;font-size:15px}.check{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:var(--card2);border-radius:12px;padding:12px}.stat b{display:block;font-size:20px;color:var(--accent)}.stat span{font-size:12px;color:var(--muted)}.sheet{margin:16px 0;border-top:1px solid var(--line);padding-top:14px}.sheethead{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:10px}.sheethead b{font-size:16px}.sheethead span{font-size:12px;color:var(--muted)}svg{width:100%;height:auto;background:#101214;border:1px solid var(--line);border-radius:12px}.legend{font-size:12px;color:var(--muted);margin-top:8px}.error{padding:12px;border-radius:10px;background:#3a2020;color:#ffbcbc;margin:10px 0}.ok{color:var(--ok)}.pill{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;background:#2b3138;color:var(--muted);font-size:12px;font-weight:700}.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:15;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));background:rgba(15,17,19,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line)}.bottomnav button{min-width:0;padding:10px 4px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}.bottomnav .ico{font-size:18px;line-height:1}.done-part{opacity:.28}.part-hit{cursor:pointer}.part-check{fill:#111;stroke:#fff;stroke-width:2}.part-check.done{fill:#67d391}.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#f4bd31;color:#111;padding:10px 14px;border-radius:999px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:750px){.four{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.cut{grid-template-columns:1fr 1fr}.cut .name{grid-column:1/-1}.cut button{grid-column:2}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div class="wrap" style="padding:0"><h1>Zink Zuschnittplaner</h1><div class="sub">Plattenbedarf, Verschnitt und Schnittbilder automatisch berechnen</div></div></header>
<main class="wrap">
<section class="card"><div class="field"><label>Auftrag / Baustelle (optional)</label><input id="jobName" type="text" placeholder="z. B. Müller – Gaube"></div></section>
<section class="card">
<h2>Ausgangsplatte</h2>
<div class="grid four">
<div class="field"><label>Plattenlänge (mm)</label><input id="sheetL" type="number" value="2000" min="1"></div>
<div class="field"><label>Plattenbreite (mm)</label><input id="sheetW" type="number" value="1000" min="1"></div>
<div class="field"><label>Randabstand (mm)</label><input id="margin" type="number" value="0" min="0"></div>
<div class="field"><label>Schnittfuge / Abstand (mm)</label><input id="gap" type="number" value="0" min="0"></div>
</div>
<div style="margin-top:12px" class="check"><input id="rotate" type="checkbox" checked><label for="rotate" style="margin:0">Teile dürfen um 90° gedreht werden</label></div>
</section>
<section class="card">
<div class="row"><div class="grow"><h2>Zuschnitte</h2><div class="sub">Länge × Breite in mm, Bedarf wahlweise als Stückzahl oder laufende Meter.</div></div><span class="pill" id="cutCount">0 Teile</span></div>
<div id="cuts" class="cuts" style="margin-top:12px"></div>

</section>
<section class="card" id="results"><h2>Ergebnis</h2><div class="sub">Noch keine Berechnung.</div></section>
</main>
<nav class="bottomnav" aria-label="Werkzeuge">
<button type="button" id="add"><span class="ico">＋</span><span>Teil</span></button>
<button type="button" id="calc"><span class="ico">✓</span><span>Berechnen</span></button>
<button type="button" class="secondary" id="demo"><span class="ico">▦</span><span>Beispiel</span></button>
<button type="button" class="danger" id="clear"><span class="ico">×</span><span>Löschen</span></button>
</nav><footer style="text-align:center;color:#6f7780;font-size:11px;padding:4px 16px calc(20px + env(safe-area-inset-bottom))">Zink Zuschnittplaner · V1.4.1</footer>
<div id="toast" class="toast" aria-live="polite"></div>
<script src="./app.js?v=1.4.1" defer></script>
</body>
</html>
